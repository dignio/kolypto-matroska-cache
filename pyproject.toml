[tool.poetry]
name = "matroska-cache"
version = "0.1.3"
description = "Caching with dependency tracking"
authors = ["Mark Vartanyan <kolypto@gmail.com>"]
repository = 'https://github.com/kolypto/py-matroska_cache'

[tool.poetry.dependencies]
python = "^3.14"
redis = {version = "^6.0", optional = true}
sqlalchemy = {version = "^1.3.19", optional = true}

[tool.poetry.group.dev.dependencies]
nox = "^2025.5.1"
pytest = "^8.4.0"
pytest-cov = "^7.0.0"
sqlalchemy = "^1.3.19"
fakeredis = "^2.31.0"

[tool.pytest.ini_options]
testpaths = [
    "tests/",
]
[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
